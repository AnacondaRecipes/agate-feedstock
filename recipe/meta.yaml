{% set name = "agate" %}
{% set version = "1.14.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 7f29841c39d84b1de7fde762b8d792085371515324f3a01413b20f810398225b

build:
  number: 0
  skip: true  # [py<310]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vvv

requirements:
  host:
    - pip
    - python
    - setuptools >=61
    - wheel
  run:
    - python
    - babel >=2.0
    - isodate >=0.5.4
    - leather >=0.3.2
    - parsedatetime >=2.1,!=2.5
    - python-slugify >=1.2.1
    - pytimeparse >=1.1.5
    - python-tzdata >=2023.3  # [win]

{% set ignore_tests = "" %}

# AssertionError: CastError('Value "1994-03-01 12:30 오후" does not match date format.')
{% set ignore_tests = ignore_tests + " --deselect=tests/test_data_types.py::TestDateTime::test_cast_format_locale" %}  # [osx]

# TypeError: ("Empty locale identifier value: None\n\nIf you didn't explicitly pass an empty value to a Babel function, this could be c)
{% set ignore_tests = ignore_tests + " --ignore=tests/test_table/test_bins.py" %}        # [win]
{% set ignore_tests = ignore_tests + " --ignore=tests/test_table/test_print_bars.py" %}  # [win]
{% set ignore_tests = ignore_tests + " --ignore=tests/test_table/test_to_csv.py" %}      # [win]
{% set ignore_tests = ignore_tests + " --ignore=tests/test_table/test_to_json.py" %}     # [win]
{% set ignore_tests = ignore_tests + " --deselect=tests/test_table/test_print_table.py::TestPrintTable::test_print_table_max_precision" %}  # [win]

test:
  source_files:
    - tests
    - examples
  imports:
    - agate
    - agate.aggregations
    - agate.columns
    - agate.computations
    - agate.config
    - agate.csv_py3
    - agate.data_types
    - agate.exceptions
    - agate.mapped_sequence
    - agate.rows
    - agate.table
    - agate.tableset
    - agate.testcase
    - agate.type_tester
    - agate.utils
    - agate.warns
  requires:
    - pip
    - lxml
    - cssselect
    - pytest
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - set "PYTHONUTF8=1"                      # [win]
    - set "PYTHONIOENCODING=UTF-8"            # [win]
    - set "PYTHONLEGACYWINDOWSFSENCODING=1"   # [win]
    - export LC_ALL=C.UTF-8                   # [unix]
    - export LANG=C.UTF-8                     # [unix]
    - pytest -ra -vv tests {{ ignore_tests }}

about:
  home: https://agate.readthedocs.io
  license: MIT
  license_family: MIT
  license_file: COPYING
  summary: A data analysis library that is optimized for humans instead of machines.
  description: |
    agate is a Python data analysis library that is optimized for humans instead of machines. 
    It is an alternative to numpy and pandas that solves real-world problems with readable code.
  doc_url: https://agate.readthedocs.io
  dev_url: https://github.com/wireservice/agate

extra:
  recipe-maintainers:
    - pmlandwehr
